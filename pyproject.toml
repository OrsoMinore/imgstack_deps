[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-stack"
dynamic = ["version"]
description = "Curated dependency bundle to bootstrap image processing projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OrsoMinore" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Curated set of the most commonly needed image-processing dependencies.
# Pulling in image-stack should give a project everything it typically needs
# to read, process, transform and visualize image data.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "imageio>=2.31",
    "tifffile>=2023.9.26",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hatchling>=1.25",
    "uv>=0.4",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/OrsoMinore/image_stack"
Issues = "https://github.com/OrsoMinore/image_stack/issues"

[tool.hatch.version]
path = "src/image_stack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/image_stack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
